apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: __NAMESPACE__
resources:
  - deployment.yaml
#SVC-BEGIN
  - service.yaml
#SVC-END
configMapGenerator:
  - name: __APP__
    envs:
      - config.env
labels:
  - pairs:
      app.kubernetes.io/name: hellnet-service
      app.kubernetes.io/instance: __APP__
    includeSelectors: false
# Tag da imagem: o workflow argocd ajusta (argocd app set --kustomize-image)
# ou edite aqui e faca merge.
images:
  - name: __IMAGE__
    newTag: __TAG__
