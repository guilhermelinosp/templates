name: terraform-validate

# Terraform fmt + init + validate
# Inputs: dir (default: .), terraform-version (default: latest)

on:
  workflow_call:
    inputs:
      dir:
        required: false
        default: "."
        type: string
      terraform-version:
        required: false
        default: "latest"
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Terraform fmt
        env:
          INPUT_DIR: ${{ inputs.dir }}
        run: |
          terraform fmt -check -recursive "$INPUT_DIR"

      - name: Terraform init
        env:
          INPUT_DIR: ${{ inputs.dir }}
        run: |
          terraform -chdir="$INPUT_DIR" init -backend=false

      - name: Terraform validate
        env:
          INPUT_DIR: ${{ inputs.dir }}
        run: |
          terraform -chdir="$INPUT_DIR" validate
