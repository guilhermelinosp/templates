name: sync-secrets

# Propaga os SECRETS do deploy (ArgoCD via Tailscale) deste repositorio para todo repositorio
# com o topico `hellnet-deploy`. Fonte unica: secrets do templates. Rotacionar = atualizar aqui.
# Requer o GitHub App hellnet-actions com permissao de Secrets (read/write).
# As variables (nao sensiveis) sao definidas por scripts/bootstrap-repo.sh.
# Para incluir um repositorio novo: gh repo edit <repo> --add-topic hellnet-deploy
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: sync-secrets
  cancel-in-progress: false

jobs:
  sync:
    name: Propagar credenciais
    runs-on: ubuntu-latest
    steps:
      - name: Token do App (somente secrets)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
          private-key: ${{ secrets.HELLNET_ACTIONS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-secrets: write
          permission-metadata: read

      - name: Propagar
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          set -euo pipefail
          repos="$(gh repo list "$OWNER" --topic hellnet-deploy --no-archived --limit 200 --json nameWithOwner --jq '.[].nameWithOwner')"
          [ -n "$repos" ] || { echo "::notice::nenhum repositorio com o topico hellnet-deploy"; exit 0; }
          for repo in $repos; do
            [ "$repo" = "$GITHUB_REPOSITORY" ] && continue
            echo "-> $repo"
            for s in TS_OAUTH_SECRET ARGOCD_TOKEN; do
              [ -n "${!s}" ] && printf '%s' "${!s}" | gh secret set "$s" -R "$repo"
            done
          done
          echo "ok"
