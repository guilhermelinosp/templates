name: nuget-publish

# NuGet pack + push to GitHub Packages + NuGet.org
# Secrets: GITHUB_TOKEN (auto), NUGET_API_KEY (optional)

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Detect solution
        run: |
          SLN=$(find . -maxdepth 1 -type f \( -name '*.slnx' -o -name '*.sln' \) -printf '%f\n' | sort | head -1)
          echo "SLN=$SLN" >> "$GITHUB_ENV"

      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "$SLN" ] && dotnet pack "$SLN" --configuration Release --output ./artifacts "-p:Version=$VERSION"

      - name: Publish to GitHub Packages
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/$REPO_OWNER/index.json" \
            --api-key "$GITHUB_PACKAGES_TOKEN"

      - name: Check NuGet.org key
        id: nuget-key
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -n "$NUGET_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to NuGet.org
        if: steps.nuget-key.outputs.present == 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY"
