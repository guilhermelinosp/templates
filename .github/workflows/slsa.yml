name: slsa

# SLSA provenance generation
# Env: COSIGN_EXPERIMENTAL=1 (auto-set)
# Inputs: image, predicate-type (default: https://slsa.dev/provenance/v1)

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      predicate-type:
        required: false
        default: "https://slsa.dev/provenance/v1"
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Generate SLSA provenance
        env:
          COSIGN_EXPERIMENTAL: "1"
          INPUT_PREDICATE_TYPE: ${{ inputs.predicate-type }}
          INPUT_IMAGE: ${{ inputs.image }}
        run: |
          cosign attest \
            --yes \
            --type slsaprovenance \
            --predicate-type "$INPUT_PREDICATE_TYPE" \
            "$INPUT_IMAGE"

      - name: Verify provenance
        env:
          COSIGN_EXPERIMENTAL: "1"
          INPUT_IMAGE: ${{ inputs.image }}
        run: |
          cosign verify-attestation \
            --type slsaprovenance \
            "$INPUT_IMAGE"
