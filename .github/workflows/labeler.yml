name: labeler

# Auto-label PRs by changed paths
# Requires: .github/labeler.yml config
# Writes via hellnet-actions installation token (pr-policy: workflow ownership by the bot).

on:
  workflow_call:
    inputs:
      app-client-id:
        required: true
        type: string
      app-id:
        description: Compatibility alias for app-id
        required: false
        type: string
    secrets:
      HELLNET_ACTIONS_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-id || inputs.app-client-id }}
          private-key: ${{ secrets.HELLNET_ACTIONS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-pull-requests: write

      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
          sync-labels: true
