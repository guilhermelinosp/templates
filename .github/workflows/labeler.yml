name: labeler

# Auto-label PRs by changed paths
# Requires: .github/labeler.yml config
# Writes via hellnet-actions installation token (pr-policy: workflow ownership by the bot).

on:
  workflow_call:
    inputs:
      app-client-id:
        required: false
        type: string
      app-id:
        description: Compatibility alias for app-id
        required: false
        type: string
    secrets:
      HELLNET_ACTIONS_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  label:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      HAS_APP_KEY: ${{ secrets.HELLNET_ACTIONS_PRIVATE_KEY != '' }}
    steps:
      - name: Token do Octo STS (sem chave privada)
        id: octo
        continue-on-error: true
        uses: octo-sts/action@v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: labeler

      - name: Create GitHub App installation token (fallback enquanto a migracao nao termina)
        id: app-token
        if: steps.octo.outcome != 'success' && env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-id || inputs.app-client-id }}
          private-key: ${{ secrets.HELLNET_ACTIONS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-pull-requests: write

      - uses: actions/labeler@v7
        with:
          repo-token: ${{ steps.octo.outputs.token || steps.app-token.outputs.token }}
          sync-labels: true
