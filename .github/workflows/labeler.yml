name: labeler

# Auto-label PRs by changed paths
# Requires: .github/labeler.yml config
# Writes via hellnet-actions installation token (pr-policy: workflow ownership by the bot).

on:
  workflow_call:
    inputs:
      app-client-id:
        required: false
        type: string
      app-id:
        description: Obsoleto, ignorado (o token vem do Octo STS)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  label:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Token do Octo STS (sem chave privada)
        id: octo
        uses: octo-sts/action@v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: labeler

      - uses: actions/labeler@v7
        with:
          repo-token: ${{ steps.octo.outputs.token }}
          sync-labels: true
