name: zap

# OWASP ZAP DAST scanning
# Secrets: GITHUB_TOKEN (auto)
# Inputs: target-url, scan-type (default: baseline), fail-on (default: HIGH)

on:
  workflow_call:
    inputs:
      target-url:
        required: true
        type: string
      scan-type:
        required: false
        default: "baseline"
        type: string
      fail-on:
        required: false
        default: "HIGH"
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: OWASP ZAP baseline
        if: ${{ inputs.scan-type == 'baseline' }}
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: ${{ inputs.target-url }}
          fail_action: true
          allow_issue_writing: false
          issue_title: "ZAP Scan Report"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: OWASP ZAP full
        if: ${{ inputs.scan-type == 'full' }}
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c
        with:
          target: ${{ inputs.target-url }}
          fail_action: true
          allow_issue_writing: false
          issue_title: "ZAP Scan Report"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: OWASP ZAP api
        if: ${{ inputs.scan-type == 'api' }}
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d
        with:
          target: ${{ inputs.target-url }}
          fail_action: true
          allow_issue_writing: false
          issue_title: "ZAP Scan Report"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: zap-${{ inputs.scan-type }}.sarif
