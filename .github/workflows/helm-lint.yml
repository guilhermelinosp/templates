name: helm-lint

# Helm lint + template + kubeconform
# Inputs: chart-dir (default: .), kube-version (default: 1.31.0)

on:
  workflow_call:
    inputs:
      chart-dir:
        required: false
        default: "."
        type: string
      kube-version:
        required: false
        default: "1.31.0"
        type: string

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: latest

      - name: Helm lint
        env:
          INPUT_CHART_DIR: ${{ inputs.chart-dir }}
        run: |
          helm lint "$INPUT_CHART_DIR" --strict

      - name: Helm template
        env:
          INPUT_CHART_DIR: ${{ inputs.chart-dir }}
        run: |
          helm template test-release "$INPUT_CHART_DIR" > /dev/null

      - name: Install kubeconform
        run: |
          wget -q https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate against K8s schema
        env:
          INPUT_CHART_DIR: ${{ inputs.chart-dir }}
          INPUT_KUBE_VERSION: ${{ inputs.kube-version }}
        run: |
          helm template test-release "$INPUT_CHART_DIR" \
            | kubeconform \
              -kubernetes-version "$INPUT_KUBE_VERSION" \
              -strict
