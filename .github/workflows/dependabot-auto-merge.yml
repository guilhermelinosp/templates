name: dependabot-auto-merge

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # 49699333 e o id numerico do dependabot[bot]; o nome do ator pode ser forjado, o id nao
    if: github.event.pull_request.user.id == 49699333 && startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ github.token }}
          alert-lookup: true

      - name: Enable patch/minor auto-merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "$EVENT_PR_NUMBER" \
            --repo "$REPO_FULL" \
            --auto --squash
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_FULL: ${{ github.repository }}
