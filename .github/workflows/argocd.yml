name: argocd

# Opera uma Application do ArgoCD pela tailnet (Tailscale) com o argocd CLI.
# Autenticacao no Tailscale: workload identity federation (OIDC do GitHub), sem secret.
# O chamador precisa de `permissions: id-token: write`.
# Secret: ARGOCD_TOKEN (token de role de projeto, restrito ao AppProject)
# Uso: uses: guilhermelinosp/templates/.github/workflows/argocd.yml@latest

on:
  workflow_call:
    inputs:
      app:
        description: Nome da Application no ArgoCD
        required: true
        type: string
      image:
        description: Imagem sem tag (ex. ghcr.io/org/app). Obrigatorio se tag for informada.
        required: false
        default: ""
        type: string
      tag:
        description: Tag a implantar (ex. v1.2.3). Vazio = manter a atual.
        required: false
        default: ""
        type: string
      action:
        description: get, diff ou sync
        required: false
        default: diff
        type: string
      argocd-server:
        description: Hostname do ArgoCD (vem de vars do chamador; sem padrao para nao expor topologia)
        required: true
        type: string
      gateway-ip:
        description: IP do gateway alcancado pela rota do Tailscale (vars do chamador)
        required: true
        type: string
      ts-client-id:
        description: Client ID da credencial federada do Tailscale (vars do chamador)
        required: true
        type: string
      ts-audience:
        description: Audience da credencial federada do Tailscale (vars do chamador)
        required: true
        type: string
      environment:
        description: Environment do GitHub (revisor obrigatorio e restricao de branch)
        required: false
        default: production
        type: string
      argocd-version:
        required: false
        default: v3.5.3
        type: string
    secrets:
      ARGOCD_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  argocd:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: argocd-${{ inputs.app }}
      cancel-in-progress: false
    env:
      APP: ${{ inputs.app }}
      IMAGE: ${{ inputs.image }}
      TAG: ${{ inputs.tag }}
      ACTION: ${{ inputs.action }}
      ARGOCD_SERVER: ${{ inputs.argocd-server }}
      ARGOCD_VERSION: ${{ inputs.argocd-version }}
      GATEWAY_IP: ${{ inputs.gateway-ip }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
    steps:
      - name: Validar entradas
        run: |
          case "$ACTION" in get|diff|sync) ;; *) echo "::error::action invalida: $ACTION"; exit 1;; esac
          if [ -n "$TAG" ]; then
            [ -n "$IMAGE" ] || { echo "::error::image e obrigatoria quando tag e informada"; exit 1; }
            echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' || { echo "::error::tag invalida: $TAG"; exit 1; }
          fi

      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ inputs.ts-client-id }}
          audience: ${{ inputs.ts-audience }}
          tags: tag:ci
          args: --accept-routes
          use-cache: "true"
          ping: ${{ inputs.gateway-ip }}

      - name: Resolver o ArgoCD pelo gateway
        run: echo "$GATEWAY_IP $ARGOCD_SERVER" | sudo tee -a /etc/hosts

      - name: Instalar argocd CLI
        run: |
          curl -fsSL -o argocd "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-amd64"
          sudo install -m 0755 argocd /usr/local/bin/argocd

      - name: Ajustar a imagem (sem commit no Git)
        if: inputs.tag != ''
        run: argocd app set "$APP" --kustomize-image "$IMAGE=$IMAGE:$TAG" --grpc-web

      - name: Executar
        run: |
          case "$ACTION" in
            get)  argocd app get  "$APP" --grpc-web ;;
            diff) argocd app diff "$APP" --grpc-web || [ $? -eq 1 ] ;;
            sync) argocd app sync "$APP" --grpc-web && argocd app wait "$APP" --health --timeout 300 --grpc-web ;;
          esac
