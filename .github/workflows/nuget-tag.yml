name: nuget-tag

# Semver bump + git tag from conventional commits

on:
  workflow_call:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # zizmor: ignore[artipacked] credenciais necessarias para push/tag neste job
        with:
          fetch-depth: 0

      - name: Bump version
        id: semver
        run: |
          LAST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' | head -1 || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Check if last tag was beta
          if [[ "$LAST_TAG" =~ -beta\.([0-9]+)$ ]]; then
            BETA_NUM=${BASH_REMATCH[1]}
            BASE="${LAST_TAG%-beta*}"
            echo "tag=${BASE}-beta.$((BETA_NUM + 1))" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS='.' read -r M m p <<< "${LAST_TAG#v}"
          M=${M:-1}; m=${m:-0}; p=${p:-0}
          LOG="$(git log --format="%s" "$LAST_TAG..HEAD")"
          if grep -q "BREAKING CHANGE\|!:" <<< "$LOG"; then
            M=$((M+1)); m=0; p=0
          elif grep -q "^feat" <<< "$LOG"; then
            m=$((m+1)); p=0
          else
            p=$((p+1))
          fi
          echo "tag=v${M}.${m}.${p}" >> "$GITHUB_OUTPUT"

      - name: Create tag
        env:
          STEP_SEMVER_TAG: ${{ steps.semver.outputs.tag }}
        run: |
          TAG="$STEP_SEMVER_TAG"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
