name: tailscale-acl

# GitOps da ACL do Tailscale: o merge na main valida (secao tests), e so entao aplica. Docs: tailscale/README.md
# Usa a MESMA credencial OIDC do CD (variables TS_CLIENT_ID e TS_AUDIENCE), que precisa dos escopos auth_keys e policy_file.
# Roda no environment production (so a main), igual ao subject da credencial; por isso nao ha teste em PR.
on:
  push:
    branches: [main]
    paths: ['tailscale/**', '.github/workflows/tailscale-acl.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: tailscale-acl
  cancel-in-progress: false

jobs:
  acl:
    name: Aplicar a ACL
    if: vars.TS_CLIENT_ID != '' && vars.TS_AUDIENCE != '' && vars.TS_TAILNET != ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Validar, testar e aplicar a ACL
        uses: tailscale/gitops-acl-action@v1
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tailnet: ${{ vars.TS_TAILNET }}
          policy-file: tailscale/policy.hujson
          action: apply
