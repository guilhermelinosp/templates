name: gosec

# Go security static analysis (gosec)
# Inputs: dir (default: ./...), severity (default: medium), confidence (default: medium)

on:
  workflow_call:
    inputs:
      dir:
        required: false
        default: "./..."
        type: string
      severity:
        required: false
        default: "medium"
        type: string
      confidence:
        required: false
        default: "medium"
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run gosec
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d
        with:
          args: >
            -severity ${{ inputs.severity }}
            -confidence ${{ inputs.confidence }}
            -fmt sarif
            -out gosec.sarif
            ${{ inputs.dir }}

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
