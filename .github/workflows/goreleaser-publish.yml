name: goreleaser-publish

# Build cross-platform binaries with GoReleaser and UPLOAD them (plus a
# checksums file) onto the EXISTING GitHub Release that the shared `release`
# workflow already created for this tag. GoReleaser does NOT manage the
# GitHub release here, so there is no "release already exists" conflict.
#
# The org `release` reusable workflow owns the GitHub Release + tag.
# This job only builds artifacts and attaches them to that release.

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        default: "."
        type: string
      go-version-file:
        required: false
        default: ""
        type: string
      args:
        description: GoReleaser args (defaults to build-only; the release is owned by the `release` workflow)
        required: false
        default: build --clean
        type: string
      pre-release-commands:
        description: Optional shell block executed in the repo before GoReleaser runs (e.g. architecture guards)
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        if: inputs.go-version-file != ''
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          # cache desligado: job de release com contents: write nao restaura cache (cache-poisoning)
          cache: false

      - name: Fetch and checkout the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0
          git fetch --tags --force
          git checkout "$(git describe --tags --abbrev=0 --exclude 'latest')"

      - name: Pre-release repository checks
        if: inputs.pre-release-commands != ''
        env:
          PRE_RELEASE_COMMANDS: ${{ inputs.pre-release-commands }}
        run: |
          printf '%s\n' "$PRE_RELEASE_COMMANDS" > "$RUNNER_TEMP/pre-release.sh"
          bash -eo pipefail "$RUNNER_TEMP/pre-release.sh"

      - name: Fetch shared GoReleaser config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gr"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/guilhermelinosp/templates/contents/goreleaser/goreleaser.yaml?ref=main" \
            -o "$RUNNER_TEMP/gr/goreleaser.yaml"

      - name: Detect main package
        id: gr
        working-directory: ${{ inputs.working-directory }}
        run: |
          d=$(find cmd -mindepth 1 -maxdepth 1 -type d | sort | head -1)
          echo "main=./$d" >> "$GITHUB_OUTPUT"
          echo "binary=$(basename "$d")" >> "$GITHUB_OUTPUT"

      - name: Publish binaries via GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ inputs.args }} --config ${{ runner.temp }}/gr/goreleaser.yaml
          workdir: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_MAIN: ${{ steps.gr.outputs.main }}
          GORELEASER_BINARY: ${{ steps.gr.outputs.binary }}

      - name: Collect artifacts with unique names + checksums
        working-directory: ${{ inputs.working-directory }}
        run: |
          rm -rf /tmp/artifacts && mkdir -p /tmp/artifacts
          cd dist
          # checksums for every real artifact (goreleaser's internal metadata.json,
          # config.yaml and artifacts.json are excluded — they are not publishable artifacts)
          find . -type f ! -name 'metadata.json' ! -name 'config.yaml' ! -name 'artifacts.json' -exec sha256sum {} + > /tmp/artifacts/checksums.txt
          # goreleaser build emits each binary under dist/<target>/<binary> with identical
          # basenames; give each a unique name so gh release upload does not collide.
          find . -type f ! -name 'metadata.json' ! -name 'config.yaml' ! -name 'artifacts.json' | while read -r f; do
            name="$(echo "$f" | sed 's#^\./##; s#/#_#g')"
            cp "$f" "/tmp/artifacts/$name"
          done
          echo "artifacts to upload:"
          ls -1 /tmp/artifacts

      - name: Upload artifacts to the existing release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="$(git describe --tags --abbrev=0 --exclude 'latest')"
          gh release upload "$TAG" /tmp/artifacts/* --clobber
