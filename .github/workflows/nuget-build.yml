name: nuget-build

# NuGet .NET restore, build, test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Detect solution
        run: |
          SLN=$(find . -maxdepth 1 -type f \( -name '*.slnx' -o -name '*.sln' \) -printf '%f\n' | sort | head -1)
          echo "SLN=$SLN" >> "$GITHUB_ENV"

      - name: Restore
        run: |
          [ -n "$SLN" ] && dotnet restore "$SLN"

      - name: Build
        run: |
          [ -n "$SLN" ] && dotnet build "$SLN" --configuration Release --no-restore

      - name: Test
        run: |
          [ -n "$SLN" ] && dotnet test "$SLN" --configuration Release --no-build --verbosity normal
