name: kube-resource

# Analyze K8s resource requests/limits
# Inputs: manifests-dir (default: .)

on:
  workflow_call:
    inputs:
      manifests-dir:
        required: false
        default: "."
        type: string

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install yq
        run: |
          wget -q "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64"
          chmod +x yq_linux_amd64
          sudo mv yq_linux_amd64 /usr/local/bin/yq

      - name: Check K8s resource requests/limits
        env:
          INPUT_MANIFESTS_DIR: ${{ inputs.manifests-dir }}
        run: |
          ERRORS=0
          ERROR_FILE=$(mktemp)
          echo 0 > "$ERROR_FILE"

          if [ ! -d "$INPUT_MANIFESTS_DIR" ]; then
            echo "::error::manifests-dir nao existe: $INPUT_MANIFESTS_DIR"
            exit 1
          fi

          # erro de yq em um arquivo e erro desse arquivo: nunca "sem campos" nem pulado em silencio
          bad_file() { echo "::error file=$1::$2"; ERRORS=$((ERRORS + 1)); }

          set +e
          while IFS= read -r -d '' FILE; do
            if ! KIND="$(yq eval '.kind' "$FILE")"; then bad_file "$FILE" "YAML invalido ou ilegivel"; continue; fi
            case "$KIND" in
              Deployment|StatefulSet|DaemonSet)
                if ! NAME="$(yq eval '.metadata.name' "$FILE")"; then bad_file "$FILE" "falha ao ler metadata.name"; continue; fi
                echo "--- Checking: $NAME ($FILE) ---"

                if ! CPU_REQ="$(yq eval '.spec.template.spec.containers[0].resources.requests.cpu' "$FILE")"; then bad_file "$FILE" "falha ao ler cpu request"; continue; fi
                if ! MEM_REQ="$(yq eval '.spec.template.spec.containers[0].resources.requests.memory' "$FILE")"; then bad_file "$FILE" "falha ao ler memory request"; continue; fi

                if [ -z "$CPU_REQ" ] || [ "$CPU_REQ" = "null" ]; then
                  echo "  No CPU request"
                  ERRORS=$((ERRORS + 1))
                else
                  echo "  CPU request: $CPU_REQ"
                fi

                if [ -z "$MEM_REQ" ] || [ "$MEM_REQ" = "null" ]; then
                  echo "  No memory request"
                  ERRORS=$((ERRORS + 1))
                else
                  echo "  Memory request: $MEM_REQ"
                fi
                ;;
            esac
          done < <(find "$INPUT_MANIFESTS_DIR" -type f \( -name '*.yaml' -o -name '*.yml' \) -print0)
          set -e

          echo "$ERRORS" > "$ERROR_FILE"
          COUNT=$(cat "$ERROR_FILE")

          if [ "$COUNT" -gt 0 ]; then
            echo "::warning::$COUNT resources missing requests"
            exit 1
          fi
          echo "All resources have requests"
