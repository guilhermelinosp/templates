name: reviewdog

# Automated code review with PR comments
# Inputs: golangci-lint (default: true), misspell (default: true), shellcheck (default: true), level (default: error)

on:
  workflow_call:
    inputs:
      golangci-lint:
        required: false
        default: true
        type: boolean
      misspell:
        required: false
        default: true
        type: boolean
      shellcheck:
        required: false
        default: true
        type: boolean
      level:
        required: false
        default: "error"
        type: string

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run golangci-lint
        if: ${{ inputs.golangci-lint }}
        uses: reviewdog/action-golangci-lint@c76cceaaab89abe74e649d2e34c6c9adc26662d2
        with:
          reporter: github-pr-review
          level: ${{ inputs.level }}
          filter_mode: diff_context

      - name: Run misspell
        if: ${{ inputs.misspell }}
        uses: reviewdog/action-misspell@ba7ac4030fa6812f8c8b2d4e516af8bc99553c32
        with:
          reporter: github-pr-review
          level: ${{ inputs.level }}
          locale: "US"

      - name: Run shellcheck
        if: ${{ inputs.shellcheck }}
        uses: reviewdog/action-shellcheck@a94d585085f1f5215ae65f4de34e7bbd0523d550
        with:
          reporter: github-pr-review
          level: ${{ inputs.level }}
          filter_mode: diff_context
