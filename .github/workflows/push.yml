name: push

# Promote container images with skopeo
# Secrets: GITHUB_TOKEN (auto), GHCR_PAT (optional)
# Inputs: image, version, runner (default: ubuntu-latest)

on:
  workflow_call:
    inputs:
      runner:
        required: false
        default: ubuntu-latest
        type: string
      image:
        required: true
        type: string
      version:
        required: false
        type: string
        default: ""
      tag:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Login GHCR
        env:
          ACTOR: ${{ github.actor }}
        run: |
          TOKEN="${{ secrets.GHCR_PAT }}"
          if [ -z "$TOKEN" ]; then TOKEN="${{ secrets.GITHUB_TOKEN }}"; fi
          echo "$TOKEN" | skopeo login ghcr.io -u "$ACTOR" --password-stdin

      - name: Promote tags
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          REPO_FULL: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          SRC="$INPUT_IMAGE"
          DST="ghcr.io/$REPO_FULL"
          skopeo copy "docker://${SRC}" "docker://${DST}:latest"
          skopeo copy "docker://${SRC}" "docker://${DST}:${GITHUB_SHA::7}"
          TAG="$INPUT_VERSION"
          if [ -n "$TAG" ]; then
            skopeo copy "docker://${SRC}" "docker://${DST}:${TAG}"
          fi
