name: release

on:
  workflow_call:
    inputs:
      app-client-id:
        required: true
        type: string
      runner:
        required: false
        default: ubuntu-latest
        type: string
    secrets:
      HELLNET_ACTIONS_PRIVATE_KEY:
        required: true
    outputs:
      version:
        value: ${{ jobs.release.outputs.version }}

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    outputs:
      version: ${{ steps.semver.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.HELLNET_ACTIONS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write

      - name: Calculate repository version
        id: semver
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          existing="$(git tag --points-at "$head" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' | head -1 || true)"
          if [ -n "$existing" ]; then echo "tag=$existing" >> "$GITHUB_OUTPUT"; exit 0; fi
          last="$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' | head -1 || true)"
          if [ -z "$last" ]; then echo 'tag=v1.0.0' >> "$GITHUB_OUTPUT"; exit 0; fi
          if [[ "$last" =~ -beta\.([0-9]+)$ ]]; then
            base="${last%-beta*}"
            echo "tag=${base}-beta.$((BASH_REMATCH[1] + 1))" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS='.' read -r major minor patch <<< "${last#v}"
          if git log --format='%s' "$last..HEAD" | grep -qE 'BREAKING CHANGE|!:'; then
            major=$((major + 1)); minor=0; patch=0
          elif git log --format='%s' "$last..HEAD" | grep -q '^feat'; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

      - name: Create immutable bot tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.semver.outputs.tag }}
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          remote="$(gh api "/repos/$REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null || true)"
          if [ -n "$remote" ]; then
            [ "$remote" = "$current" ] || { echo "Tag $TAG already points elsewhere" >&2; exit 1; }
            exit 0
          fi
          git tag -a "$TAG" -m "Release $TAG" "$current"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub release as the bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.semver.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPOSITORY" --title "$TAG" --generate-notes
          fi
