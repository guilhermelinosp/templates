name: branch-rules

on:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.head_ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validar nomenclatura do branch
        run: |
          set -eo pipefail
          ref="${HEAD_REF}"
          echo "Branch: ${ref}"
          [[ -z "${ref}" ]] && exit 0
          if [[ ! "${ref}" =~ ^(feat|fix|chore|docs|refactor|perf|test|build|ci|style|revert|release|dependabot|renovate|bot)/ ]]; then
            echo "::error title=Branch naming::branch '${ref}' deve começar com um prefixo do tipo feat/, fix/, chore/, docs/, refactor/, release/, dependabot/, renovate/ etc."
            exit 1
          fi
          if [[ "${ref}" =~ [A-Z_\ ] ]]; then
            echo "::error title=Branch naming::branch '${ref}' deve estar em minúsculas, sem underscores nem espaços."
            exit 1
          fi
      - name: Validar título do pull request
        run: |
          set -eo pipefail
          title="${PR_TITLE}"
          if [[ -z "${title}" ]] || (( ${#title} > 100 )); then
            echo "::error title=PR title::o título do PR deve ter entre 1 e 100 caracteres."
            exit 1
          fi
          echo "PR title OK (${#title} chars)."
      - name: Compliance — pins imutáveis do control plane
        env:
          REPO_FULL: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          repo="$REPO_FULL"
          sha="$COMMIT_SHA"

          # Qualquer falha da API, JSON invalido ou campo ausente interrompe o passo (exit != 0).
          # Nunca vira lista vazia nem "sem violacao".
          tree_json="$(gh api "repos/${repo}/git/trees/${sha}?recursive=1")"
          truncated="$(jq -r '.truncated' <<< "$tree_json")"
          if [[ "$truncated" != "false" ]]; then
            echo "::error::arvore do commit incompleta (truncated=$truncated); a verificacao nao pode ser garantida"
            exit 1
          fi
          paths="$(jq -r '.tree[].path' <<< "$tree_json")"

          # grep sem resultado sai com 1 (nenhum workflow local). Outro codigo de saida interrompe.
          set +e
          files="$(grep -E '^\.github/workflows/.+\.ya?ml$' <<< "$paths")"
          grep_rc=$?
          set -e
          if (( grep_rc > 1 )); then
            echo "::error::falha ao filtrar os workflows (grep rc=$grep_rc)"
            exit 1
          fi
          if [[ -z "$files" ]]; then
            echo "Sem workflows locais — OK"
            exit 0
          fi

          while IFS= read -r f; do
            # '// error(...)' falha quando o campo nao existe: ausencia nunca vira conteudo vazio
            content="$(gh api "repos/${repo}/contents/${f}?ref=${sha}" --jq '.content // error("resposta sem campo content")')"
            decoded="$(base64 -d <<< "$content")"
            if grep -qE 'uses: +guilhermelinosp/templates/[^@ ]+@(main|latest|master)([ $#]|$)' <<< "$decoded"; then
              echo "::error file=${f}::referência não imutável a guilhermelinosp/templates (use SHA 40-hex, nunca @main/@latest/@master)."
              exit 1
            fi
          done <<< "$files"
          echo "Todos os pins do control plane são imutáveis — OK."
