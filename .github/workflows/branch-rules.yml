name: branch-rules

on:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.head_ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validar nomenclatura do branch
        run: |
          set -eo pipefail
          ref="${HEAD_REF}"
          echo "Branch: ${ref}"
          [[ -z "${ref}" ]] && exit 0
          if [[ ! "${ref}" =~ ^(feat|fix|chore|docs|refactor|perf|test|build|ci|style|revert|release|dependabot|renovate|bot)/ ]]; then
            echo "::error title=Branch naming::branch '${ref}' deve começar com um prefixo do tipo feat/, fix/, chore/, docs/, refactor/, release/, dependabot/, renovate/ etc."
            exit 1
          fi
          if [[ "${ref}" =~ [A-Z_\ ] ]]; then
            echo "::error title=Branch naming::branch '${ref}' deve estar em minúsculas, sem underscores nem espaços."
            exit 1
          fi
      - name: Validar título do pull request
        run: |
          set -eo pipefail
          title="${PR_TITLE}"
          if [[ -z "${title}" ]] || (( ${#title} > 100 )); then
            echo "::error title=PR title::o título do PR deve ter entre 1 e 100 caracteres."
            exit 1
          fi
          echo "PR title OK (${#title} chars)."
