name: helm-publish

# Package and publish Helm charts to OCI
# Secrets: GITHUB_TOKEN (auto)
# Inputs: chart-dir (default: .), registry (default: oci://ghcr.io/org/helm-charts), version

on:
  workflow_call:
    inputs:
      chart-dir:
        required: false
        default: "."
        type: string
      registry:
        required: false
        default: oci://ghcr.io/${{ github.repository_owner }}/helm-charts
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: latest

      - name: Login to GHCR
        env:
          ACTOR: ${{ github.actor }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            -u "$ACTOR" --password-stdin

      - name: Package chart
        env:
          INPUT_CHART_DIR: ${{ inputs.chart-dir }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          helm package "$INPUT_CHART_DIR" \
            --version "$INPUT_VERSION" \
            --destination /tmp/charts

      - name: Push chart
        env:
          INPUT_REGISTRY: ${{ inputs.registry }}
        run: |
          CHART=$(find /tmp/charts -maxdepth 1 -name '*.tgz' | head -1)
          if [ -z "$CHART" ]; then
            echo "No chart package found"
            exit 1
          fi
          helm push "$CHART" "$INPUT_REGISTRY"
