name: go-build

# Go build, vet, lint, test with cache
# Inputs: go-version (default: stable) XOR go-version-file (file wins),
#         golangci-version (default: latest), working-directory (default: .)

on:
  workflow_call:
    inputs:
      go-version:
        required: false
        default: "stable"
        type: string
      golangci-version:
        required: false
        default: "v2.15.0"
        type: string
      working-directory:
        required: false
        default: "."
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Module integrity
        run: |
          go mod verify
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod/go.sum fora de sincronia: rode 'go mod tidy' e commite"
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::arquivos sem gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Use local golangci config when present
        run: |
          if [ -f .golangci.yml ]; then
            cp .golangci.yml .golangci.ci.yml
          else
            echo "{}" > .golangci.ci.yml
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci-version }}
          working-directory: ${{ inputs.working-directory }}
          args: --config .golangci.ci.yml

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 -race -shuffle=on ./...
