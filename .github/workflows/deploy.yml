name: deploy

# Helm upgrade via kubeconfig secret
# Secrets: KUBECONFIG (base64 kubeconfig, via kubeconfig-secret input)
# Inputs: namespace, release-name, chart-dir (default: .), kubeconfig-secret (default: KUBECONFIG), values-file, image

on:
  workflow_call:
    inputs:
      namespace:
        required: true
        type: string
      release-name:
        required: true
        type: string
      chart-dir:
        required: false
        default: "."
        type: string
      kubeconfig-secret:
        required: false
        default: "KUBECONFIG"
        type: string
      values-file:
        required: false
        default: ""
        type: string
      image:
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: latest

      - name: Setup kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets[inputs.kubeconfig-secret] }} # zizmor: ignore[overprovisioned-secrets] o nome do secret vem do input do chamador; a interface e mantida
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Helm upgrade
        env:
          INPUT_RELEASE_NAME: ${{ inputs.release-name }}
          INPUT_CHART_DIR: ${{ inputs.chart-dir }}
          INPUT_NAMESPACE: ${{ inputs.namespace }}
          INPUT_VALUES_FILE: ${{ inputs.values-file }}
          INPUT_IMAGE: ${{ inputs.image }}
        run: |
          RELEASE="$INPUT_RELEASE_NAME"
          CHART="$INPUT_CHART_DIR"
          NS="$INPUT_NAMESPACE"
          ARGS=()
          if [ -n "$INPUT_VALUES_FILE" ]; then
            ARGS+=(-f "$INPUT_VALUES_FILE")
          fi
          if [ -n "$INPUT_IMAGE" ]; then
            ARGS+=(--set "image.repository=$INPUT_IMAGE")
          fi
          helm upgrade --install "$RELEASE" \
            "$CHART" \
            --namespace "$NS" \
            --create-namespace \
            --wait \
            --timeout 5m \
            "${ARGS[@]}"

      - name: Verify rollout
        env:
          INPUT_RELEASE_NAME: ${{ inputs.release-name }}
          INPUT_NAMESPACE: ${{ inputs.namespace }}
        run: |
          kubectl rollout status deployment/"$INPUT_RELEASE_NAME" \
            --namespace "$INPUT_NAMESPACE" \
            --timeout 5m
