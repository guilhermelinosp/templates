name: deploy

run-name: deploy ${{ inputs.app }} ${{ inputs.tag }}

# Hub de deploy: TODOS os secrets e a config de cada app ficam so neste repositorio.
# Disparo manual: gh workflow run deploy.yml -R guilhermelinosp/templates -f app=fast-platform -f tag=v1.2.3
# Tailscale: identidade federada (OIDC do GitHub, sem secret e SEM vencimento) quando as variables TS_CLIENT_ID e
# TS_AUDIENCE existem; senao, auth key (TS_AUTHKEY, vence em ate 90 dias). Ver infrastructure/README.md.
# Secrets: ARGOCD_TOKEN e, so no modo auth key, TS_AUTHKEY
# Variables: ARGOCD_SERVER, K8S_API_HOST (e TS_CLIENT_ID, TS_AUDIENCE no modo OIDC)
# Para incluir uma app: adicione-a em `options` e no `case` do passo Validar entradas.
# A config (env) vive em infrastructure/configmap.yml de cada repositorio (o ArgoCD a aplica); a versao da imagem e do Image Updater.
on:
  workflow_dispatch:
    inputs:
      app:
        description: Aplicacao
        type: choice
        options: [fast-platform, fast-sockets, fast-listeners]
        required: true
      action:
        description: Acao no ArgoCD
        type: choice
        options: [diff, sync]
        default: diff
      tag:
        description: Fixa uma tag (ex. v1.2.3), p.ex. para rollback. O Image Updater volta a versao mais nova no proximo ciclo, a menos que voce o pause. Vazio = nao mexer.
        type: string
        required: false
      restart:
        description: Reiniciar o Deployment depois do sync
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.app }}
  cancel-in-progress: false

env:
  APP: ${{ inputs.app }}
  ACTION: ${{ inputs.action }}
  TAG: ${{ inputs.tag }}
  NAMESPACE: fast
  IMAGE_BASE: ghcr.io/guilhermelinosp
  ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
  GATEWAY_IP: ${{ vars.K8S_API_HOST }}

jobs:
  deploy:
    name: Deploy ${{ inputs.app }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Validar entradas
        run: |
          case "$APP" in fast-platform|fast-sockets|fast-listeners) ;; *) echo "::error::app nao permitida: $APP"; exit 1;; esac
          if [ -n "$TAG" ] && ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::tag invalida: $TAG"; exit 1
          fi
          [ -n "$ARGOCD_SERVER" ] && [ -n "$GATEWAY_IP" ] || { echo "::error::configure as variables ARGOCD_SERVER e K8S_API_HOST"; exit 1; }

      - name: Tailscale (identidade federada, sem vencimento)
        if: vars.TS_CLIENT_ID != '' && vars.TS_AUDIENCE != ''
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          use-cache: "true"
          ping: ${{ vars.K8S_API_HOST }}

      - name: Tailscale (auth key)
        if: vars.TS_CLIENT_ID == '' || vars.TS_AUDIENCE == ''
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          use-cache: "true"
          ping: ${{ vars.K8S_API_HOST }}

      - name: Resolver o ArgoCD pelo gateway
        run: echo "$GATEWAY_IP $ARGOCD_SERVER" | sudo tee -a /etc/hosts

      - name: ArgoCD (API REST)
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
          RESTART: ${{ inputs.restart }}
        run: bash scripts/argocd-rest.sh
