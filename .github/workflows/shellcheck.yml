name: shellcheck

# ShellCheck linter
# Inputs: dir (default: .)

on:
  workflow_call:
    inputs:
      dir:
        required: false
        default: "."
        type: string

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: ShellCheck
        uses: reviewdog/action-shellcheck@v1
        with:
          reporter: github-check
          level: error
          filter_mode: nofilter
          workdir: ${{ inputs.dir }}

      - name: Check formatting (shfmt)
        env:
          INPUT_DIR: ${{ inputs.dir }}
        run: |
          sudo apt-get update && sudo apt-get install -y shfmt
          find "$INPUT_DIR" -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -r shfmt -d \
            || echo "Run 'shfmt -w .' to fix formatting"
