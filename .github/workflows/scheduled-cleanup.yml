name: scheduled-cleanup

# Cleanup old GHCR container packages
# Secrets: GHCR_PAT (required - packages:write scope)
# Inputs: package-names, days-old (default: 90), dry-run (default: true)

on:
  workflow_call:
    inputs:
      package-names:
        required: true
        type: string
      days-old:
        required: false
        default: 90
        type: number
      dry-run:
        required: false
        default: true
        type: boolean
    secrets:
      GHCR_PAT:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        env:
          ACTOR: ${{ github.actor }}
        run: |
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io \
            -u "$ACTOR" --password-stdin

      - name: List and delete old versions
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
          INPUT_DAYS_OLD: ${{ inputs.days-old }}
          INPUT_PACKAGE_NAMES: ${{ inputs.package-names }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          DRY_RUN="$INPUT_DRY_RUN"
          CUTOFF=$(date -d "-$INPUT_DAYS_OLD days" +%s)

          for PKG in $(echo "$INPUT_PACKAGE_NAMES" | tr ',' ' '); do
            echo "=== Processing package: $PKG ==="

            # erro de API nao pode virar "nenhuma versao" nem "owner orgs": so 404 significa pacote ausente
            USER_TYPE="$(gh api /user --jq '.type')"
            OWNER_TYPE="orgs"
            if [ "$USER_TYPE" = "User" ]; then
              OWNER_TYPE="users"
            fi
            VERS_ERR="$(mktemp)"
            if VERSIONS="$(gh api "/$OWNER_TYPE/$REPO_OWNER/packages/container/$PKG/versions" \
              --jq '.[] | select(.metadata.container.tags | length > 0) | {id, tags: .metadata.container.tags, created_at}' 2>"$VERS_ERR")"; then
              :
            elif grep -q 'HTTP 404' "$VERS_ERR"; then
              VERSIONS=""
            else
              cat "$VERS_ERR" >&2; rm -f "$VERS_ERR"; exit 1
            fi
            rm -f "$VERS_ERR"

            if [ -z "$VERSIONS" ]; then
              echo "No versions found for $PKG"
              continue
            fi

            echo "$VERSIONS" | jq -c '.' | while read -r VER; do
              CREATED=$(echo "$VER" | jq -r '.created_at')
              # data invalida nao pode virar timestamp 0 (que deixaria a versao elegivel para apagar)
              CREATED_TS="$(date -d "$CREATED" +%s)"
              [[ "$CREATED_TS" =~ ^[0-9]+$ ]] || { echo "::error::data de criacao invalida para $PKG: $CREATED" >&2; exit 1; }
              TAGS=$(echo "$VER" | jq -r '.tags | join(", ")')
              ID=$(echo "$VER" | jq -r '.id')

              if [ "$CREATED_TS" -lt "$CUTOFF" ]; then
                echo "  🗑️  $TAGS (created $CREATED)"
                if [ "$DRY_RUN" != "true" ]; then
                  gh api --method DELETE "/orgs/$REPO_OWNER/packages/container/$PKG/versions/$ID"
                fi
              else
                echo "  ✅ $TAGS (kept)"
              fi
            done
          done

      - name: Summary
        env:
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            echo "⚠️  Dry-run mode — no packages deleted."
            echo "Set dry-run: false to actually delete."
          else
            echo "✅ Cleanup completed."
          fi
