name: maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  pin-actions:
    runs-on: ubuntu-latest
    steps:
      - name: Create maintenance token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
          private-key: ${{ secrets.HELLNET_ACTIONS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Open a verified pinning PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, datetime, json, os, re, urllib.error
          from urllib.request import Request, urlopen

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          api_root = 'https://api.github.com'

          def api(path, method='GET', body=None):
              req = Request(api_root + path, method=method, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              if body is not None:
                  req.data = json.dumps(body).encode()
                  req.add_header('Content-Type', 'application/json')
              try:
                  with urlopen(req, timeout=30) as response:
                      return json.loads(response.read() or b'{}')
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise

          branch = 'chore/hellnet-actions-maintenance-' + datetime.datetime.now(datetime.UTC).strftime('%Y%m%d')
          base = api(f'/repos/{repo}/git/ref/heads/main')['object']['sha']
          if api(f'/repos/{repo}/git/ref/heads/{branch}'):
              print(f'{branch} already exists; leaving the existing maintenance PR for review')
              raise SystemExit(0)

          tree = api(f'/repos/{repo}/git/trees/main?recursive=1')['tree']
          files = [item['path'] for item in tree if item['type'] == 'blob' and
                   re.fullmatch(r'\.github/workflows/[^/]+\.ya?ml', item['path'])]
          use_pattern = re.compile(r'(uses:\s*[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@)([^\s#]+)')
          changes = []
          for path in files:
              item = api(f'/repos/{repo}/contents/{path}?ref=main')
              content = base64.b64decode(item['content']).decode()
              changed = [False]
              def pin(match):
                  ref = match.group(2)
                  if re.fullmatch(r'[0-9a-fA-F]{40}', ref):
                      return match.group(0)
                  owner_repo = re.search(r'uses:\s*([^@]+)@', match.group(0)).group(1)
                  resolved = api(f'/repos/{owner_repo}/commits/{urllib.parse.quote(ref, safe="")}')
                  if not resolved:
                      return match.group(0)
                  changed[0] = True
                  return match.group(1) + resolved['sha']
              import urllib.parse
              updated = use_pattern.sub(pin, content)
              if changed[0] and updated != content:
                  changes.append((path, item['sha'], updated))

          if not changes:
              print('All workflow references are already pinned')
              raise SystemExit(0)
          api(f'/repos/{repo}/git/refs', 'POST', {'ref': f'refs/heads/{branch}', 'sha': base})
          for path, blob_sha, content in changes:
              result = api(f'/repos/{repo}/contents/{path}', 'PUT', {
                  'message': f'chore(ci): pin {path} to immutable commits',
                  'content': base64.b64encode(content.encode()).decode(),
                  'sha': blob_sha,
                  'branch': branch,
              })
              commit_sha = result['commit']['sha']
              verified = api(f'/repos/{repo}/commits/{commit_sha}')['commit']['verification']['verified']
              if verified is not True:
                  raise RuntimeError(f'GitHub did not verify maintenance commit {commit_sha}')
          pr = api(f'/repos/{repo}/pulls', 'POST', {
              'title': 'chore(ci): pin GitHub Actions to immutable commits',
              'head': branch,
              'base': 'main',
              'body': '<!-- hellnet-actions-maintenance -->\n\nAutomated pin refresh by `hellnet-actions[bot]`.\n\nEvery generated commit was checked with `verification.verified == true`.\nThis PR is not auto-merged.',
          })
          print(pr['html_url'])
          PY
