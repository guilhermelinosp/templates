name: pipeline

# templates' own release pipeline.
# This repository cannot call its own reusable workflows, so release
# semantics are implemented locally.
#
# Every push to main creates the next SemVer tag and GitHub Release
# using the hellnet-actions GitHub App.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: templates-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.semver.outputs.tag }}

    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HELLNET_ACTIONS_CLIENT_ID }}
          private-key: ${{ secrets.HELLNET_ACTIONS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Calculate next version
        id: semver
        shell: bash
        run: |
          set -euo pipefail

          HEAD=$(git rev-parse HEAD)
          SEMVER='^v[0-9]+\.[0-9]+\.[0-9]+$'

          EXISTING_TAG=$(
            git tag --points-at "$HEAD" |
              grep -E "$SEMVER" |
              head -1 ||
              true
          )

          if [ -n "$EXISTING_TAG" ]; then
            echo "tag=$EXISTING_TAG" >> "$GITHUB_OUTPUT"
            echo "HEAD already tagged as $EXISTING_TAG"
            exit 0
          fi

          LAST_TAG=$(
            git tag --sort=-version:refname |
              grep -E "$SEMVER" |
              head -1 ||
              true
          )

          if [ -z "$LAST_TAG" ]; then
            echo "tag=v1.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Last release: $LAST_TAG"

          IFS='.' read -r major minor patch <<< "${LAST_TAG#v}"

          if git log --format='%s%n%b' "$LAST_TAG..HEAD" |
            grep -q 'BREAKING CHANGE\|!:'; then

            major=$((major + 1))
            minor=0
            patch=0

          elif git log --format='%s' "$LAST_TAG..HEAD" |
            grep -q '^feat'; then

            minor=$((minor + 1))
            patch=0

          else
            patch=$((patch + 1))
          fi

          TAG="v${major}.${minor}.${patch}"

          echo "Next release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create immutable tag through GitHub API
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.semver.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          HEAD=$(git rev-parse HEAD)

          echo "Checking tag $TAG"

          if existing=$(
            gh api \
              "repos/$REPOSITORY/git/ref/tags/$TAG" \
              --jq '.object.sha' \
              2>/dev/null
          ); then

            if [ "$existing" != "$HEAD" ]; then
              echo "Tag $TAG already points to $existing" >&2
              echo "Expected HEAD: $HEAD" >&2
              exit 1
            fi

            echo "Tag $TAG already points to HEAD — skipping creation"

          else
            echo "Creating tag $TAG at $HEAD"

            gh api \
              --method POST \
              "repos/$REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" \
              -f "sha=$HEAD" \
              >/dev/null

            echo "Tag $TAG created successfully"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.semver.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" \
            --repo "$REPOSITORY" \
            >/dev/null 2>&1; then

            echo "Release $TAG already exists — skipping"

          else
            echo "Creating release $TAG"

            gh release create "$TAG" \
              --repo "$REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              --latest

            echo "Release $TAG created successfully"
          fi
