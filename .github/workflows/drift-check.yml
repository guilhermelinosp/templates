name: golangci-config-drift

# Detects when a Hellnet Go repo's committed .golangci.yml drifts from the
# canonical config owned by ci-templates. Fails the workflow (and notifies via
# the run status) so drift is caught before it spreads.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check drift across Hellnet Go repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          canonical="$(curl -fsSL https://raw.githubusercontent.com/guilhermelinosp/ci-templates/main/.golangci.yml)"
          repos="hellnet-lib-kafka hellnet-lib-cache golang-lib-template golang-api-template golang-worker-template golang-cli-template hellnet-lib-telemetry"
          status=0
          for r in $repos; do
            # falha ao obter o arquivo (repo ausente, sem acesso ou rede) e erro, nunca "drift"
            if ! cfg="$(curl -fsSL "https://raw.githubusercontent.com/guilhermelinosp/$r/main/.golangci.yml")"; then
              echo "::error::nao foi possivel obter .golangci.yml de $r (ausente, sem acesso ou falha de rede)"
              status=1
              continue
            fi
            if [ "$cfg" != "$canonical" ]; then
              echo "::error::DRIFT detected in $r"
              status=1
            else
              echo "OK: $r"
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "Alguns repos divergiram do golangci canonico ou nao puderam ser verificados (veja os erros acima)."
            exit 1
          fi
          echo "All repos aligned with the canonical golangci config."
