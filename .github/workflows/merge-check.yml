name: merge-check

# Validate PR merge strategy + conventional commits
# Inputs: runner (default: ubuntu-latest)

on:
  workflow_call:
    inputs:
      runner:
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: read
  checks: write

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check merge strategy (--no-ff)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE="$BASE_REF"
          # a base precisa existir localmente: falha de fetch e erro, nao skip
          # refspec completo: o curto (main:refs/remotes/...) nao cria a ref de rastreamento
          git fetch --no-tags origin "refs/heads/$BASE:refs/remotes/origin/$BASE"

          set +e
          git merge-base --is-ancestor "origin/$BASE" HEAD
          anc_rc=$?
          set -e
          if [ "$anc_rc" -gt 1 ]; then
            echo "::error::merge-base falhou (rc=$anc_rc)"
            exit 1
          fi
          if [ "$anc_rc" -ne 0 ]; then
            echo "::notice::branch nao contem origin/$BASE (base desatualizada); check de ancestralidade nao aplicado"
            exit 0
          fi

          COMMITS=$(git log --oneline "origin/$BASE..HEAD" | wc -l)
          echo "Commits to merge: $COMMITS"

      - name: Confirm base branch
        if: github.base_ref == 'main'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "PR approved for $BASE_REF"

      - name: Conventional Commits check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          BASE="$BASE_REF"

          MERGE_BASE="$(git merge-base "origin/$BASE" HEAD)"

          LOG="$(git log --format='%s' "$MERGE_BASE..HEAD")"
          ERRORS=0
          while IFS= read -r COMMIT; do
            [ -n "$COMMIT" ] || continue
            if echo "$COMMIT" | grep -qE '^Initial plan$'; then
              continue
            fi

            if ! echo "$COMMIT" | grep -qE '^(feat|fix|docs|style|ref|refactor|test|chore|ci|perf|build|revert)(\([a-zA-Z0-9_-]+\))?:\s.+'; then
              if echo "$COMMIT" | grep -q '^Merge'; then
                continue
              fi
              echo "Commit does not follow Conventional Commits: $COMMIT"
              ERRORS=$((ERRORS + 1))
            fi
          done <<< "$LOG"

          if [ "$ERRORS" -gt 0 ]; then
            echo "$ERRORS commits do not follow Conventional Commits"
            exit 1
          fi
          echo "All commits follow Conventional Commits"
