name: pr-policy

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Validate title, branch and workflow ownership
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_TITLE" | grep -qE '^(feat|fix|docs|style|refactor|test|chore|ci|perf|build|revert)(\([a-zA-Z0-9_.-]+\))?: .+' \
            || { echo 'Invalid PR title; use Conventional Commits'; exit 1; }
          printf '%s' "$PR_BRANCH" | grep -qE '^(feat|fix|ci|chore|docs|refactor|build|test|bot|schema)/[^/]+$' \
            || { echo "Unsupported branch name: $PR_BRANCH"; exit 1; }

          files="$(gh api --paginate "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')"
          if printf '%s\n' "$files" | grep -qE '^\.github/workflows/'; then
            [ "$PR_AUTHOR" = 'hellnet-actions[bot]' ] \
              || { echo 'Workflow changes must be proposed by hellnet-actions[bot]'; exit 1; }
          fi
          if printf '%s' "$PR_BRANCH" | grep -qE '^bot/' && [ "$PR_AUTHOR" != 'hellnet-actions[bot]' ]; then
            echo 'bot/* branches are reserved for hellnet-actions[bot]'
            exit 1
          fi

      - name: Run shell syntax checks when applicable
        run: |
          set -euo pipefail
          scripts="$(find . -type f -name '*.sh' -not -path './.git/*')"
          if [ -n "$scripts" ]; then
            while IFS= read -r script; do bash -n "$script"; done <<< "$scripts"
          else
            echo 'No shell scripts in this repository'
          fi
