name: auto-pr

on:
  workflow_call:
    inputs:
      app-client-id:
        description: Obsoleto, ignorado (o token vem do Octo STS)
        required: false
        type: string
      app-id:
        description: Obsoleto, ignorado (o token vem do Octo STS)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Token do Octo STS (sem chave privada)
        id: octo
        uses: octo-sts/action@v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: auto-pr

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.octo.outputs.token }}

      - name: Create or update PR to main
        id: create-pr
        env:
          GH_TOKEN: ${{ steps.octo.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          case "$BRANCH" in
            feat/*|fix/*|ci/*|chore/*|docs/*|refactor/*|build/*|test/*) ;;
            main)
              echo "Branch is main — skipping"
              exit 0
              ;;
            *)
              echo "Unsupported automation branch: $BRANCH"
              exit 0
              ;;
          esac

          EXISTING=$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" \
            --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists for $BRANCH — updating"
            gh pr edit "$EXISTING" --repo "$REPOSITORY" \
              --body "Auto-generated PR from \`$BRANCH\`."
            echo "pr_number=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main
          COMMITS=$(git rev-list --count origin/main..HEAD)
          if [ "$COMMITS" -eq 0 ]; then
            echo "No new commits — skipping"
            exit 0
          fi

          TITLE=$(git log --format="%s" origin/main..HEAD | tail -1)
          [ -n "$TITLE" ] || TITLE="chore: auto PR from $BRANCH"
          PR_URL=$(gh pr create --repo "$REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "Auto-generated PR from \`$BRANCH\`." )
          echo "$PR_URL"
          echo "pr_number=${PR_URL##*/}" >> "$GITHUB_OUTPUT"
