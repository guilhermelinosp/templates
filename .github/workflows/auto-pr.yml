name: auto-pr

on:
  workflow_call:
    inputs:
      app-client-id:
        description: Compatibility alias for app-id
        required: false
        type: string
      app-id:
        description: GitHub App client ID for hellnet-actions
        required: false
        type: string
    secrets:
      HELLNET_ACTIONS_PRIVATE_KEY:
        description: Opcional (fallback do App). O caminho principal e o Octo STS, sem chave
        required: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    env:
      HAS_APP_KEY: ${{ secrets.HELLNET_ACTIONS_PRIVATE_KEY != '' }}
    steps:
      - name: Token do Octo STS (sem chave privada)
        id: octo
        continue-on-error: true
        uses: octo-sts/action@v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: auto-pr

      - name: Create GitHub App installation token (fallback enquanto a migracao nao termina)
        id: app-token
        if: steps.octo.outcome != 'success' && env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-id || inputs.app-client-id }}
          private-key: ${{ secrets.HELLNET_ACTIONS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.octo.outputs.token || steps.app-token.outputs.token }}

      - name: Create or update PR to main
        id: create-pr
        env:
          GH_TOKEN: ${{ steps.octo.outputs.token || steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          case "$BRANCH" in
            feat/*|fix/*|ci/*|chore/*|docs/*|refactor/*|build/*|test/*) ;;
            main)
              echo "Branch is main — skipping"
              exit 0
              ;;
            *)
              echo "Unsupported automation branch: $BRANCH"
              exit 0
              ;;
          esac

          EXISTING=$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" \
            --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists for $BRANCH — updating"
            gh pr edit "$EXISTING" --repo "$REPOSITORY" \
              --body "Auto-generated PR from \`$BRANCH\`."
            echo "pr_number=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main
          COMMITS=$(git rev-list --count origin/main..HEAD)
          if [ "$COMMITS" -eq 0 ]; then
            echo "No new commits — skipping"
            exit 0
          fi

          TITLE=$(git log --format="%s" origin/main..HEAD | tail -1)
          [ -n "$TITLE" ] || TITLE="chore: auto PR from $BRANCH"
          PR_URL=$(gh pr create --repo "$REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "Auto-generated PR from \`$BRANCH\`." )
          echo "$PR_URL"
          echo "pr_number=${PR_URL##*/}" >> "$GITHUB_OUTPUT"
