version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      # as acoes do mesmo conjunto (codeql-action: init, analyze e upload-sarif)
      # precisam subir juntas, num unico PR
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"

