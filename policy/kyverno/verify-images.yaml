# Verifica assinatura keyless (Cosign + identidade OIDC do GitHub Actions) de imagens
# publicadas pelo dono guilhermelinosp em ghcr.io. Assinatura sozinha nao prova origem:
# a identidade do signer e restrita ao dono do repositorio.
# Exige digest (@sha256:...) para impedir tags mutaveis.
# Escopo: a politica casa pods com pelo menos uma imagem do dono. Nesses pods, TODOS os containers
# (inclusive initContainers) precisam de digest e assinatura do dono; imagens de terceiros em pod misto sao negadas.
# ephemeralContainers nao sao cobertos (a regra casa CREATE/UPDATE de pods, nao o subrecurso ephemeralcontainers).
# Ajuste 'matchImageReferences' e 'subjectRegExp' antes de usar em outro dono ou registry.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-signed-images
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "ghcr.io/guilhermelinosp/*"
  attestors:
    - name: githubactions
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: "^https://github\\.com/guilhermelinosp/.+$"
  validations:
    - expression: "(object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])).all(c, c.image.contains('@sha256:'))"
      message: "Use imagem por digest (@sha256:...), nao por tag mutavel."
    - expression: "(object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])).all(c, verifyImageSignatures(c.image, [attestors.githubactions]) > 0)"
      message: "Assinatura Cosign keyless do dono guilhermelinosp nao verificada."
