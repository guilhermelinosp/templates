apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: __NAMESPACE__
resources:
  - application.yml
  - configmap.yml
labels:
  - pairs:
      app.kubernetes.io/instance: __APP__
    includeSelectors: false
# A versao da imagem NAO fica no Git: o ArgoCD Image Updater (image-updater.yml) a mantem na Application.
