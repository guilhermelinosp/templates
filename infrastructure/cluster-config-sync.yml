# Credencial do cluster usada pelo deploy.yml SOMENTE para aplicar ConfigMaps no namespace fast.
# Aplicar uma vez: kubectl apply -f cluster-config-sync.yml
# Depois gere os secrets KUBE_TOKEN e KUBE_CA no repositorio templates:
#   kubectl -n fast get secret config-sync-token -o jsonpath='{.data.token}' | base64 -d
#   kubectl -n fast get secret config-sync-token -o jsonpath='{.data.ca\.crt}'   # ja em base64
apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-sync
  namespace: fast
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-sync
  namespace: fast
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-sync
  namespace: fast
subjects:
  - kind: ServiceAccount
    name: config-sync
    namespace: fast
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: config-sync
---
apiVersion: v1
kind: Secret
metadata:
  name: config-sync-token
  namespace: fast
  annotations:
    kubernetes.io/service-account.name: config-sync
type: kubernetes.io/service-account-token
