apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: __NAMESPACE__
resources:
  - application.yaml
  - configmap.yml
labels:
  - pairs:
      app.kubernetes.io/instance: __APP__
    includeSelectors: false
# Tag da imagem: o deploy.yml do templates ajusta (argocd app set --kustomize-image)
# ou edite aqui e faca merge.
images:
  - name: __IMAGE__
    newTag: __TAG__
