# ArgoCD Image Updater: mantem a imagem de cada app na ULTIMA versao semver publicada no GHCR.
# Escreve direto na Application (write-back argocd): sem commit, sem PR. Aplicar uma vez no cluster.
# So considera tags que EXISTEM no registry, entao uma release sem imagem ainda nao e implantada.
# Nova app: acrescente um bloco em applicationRefs.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: fast
  namespace: argocd
spec:
  writeBackConfig:
    method: argocd
  commonUpdateSettings:
    updateStrategy: semver
    allowTags: "regexp:^v[0-9]+\\.[0-9]+\\.[0-9]+$"
  applicationRefs:
    - namePattern: fast-platform
      images:
        - alias: app
          imageName: ghcr.io/guilhermelinosp/fast-platform
    - namePattern: fast-sockets
      images:
        - alias: app
          imageName: ghcr.io/guilhermelinosp/fast-sockets
    - namePattern: fast-listeners
      images:
        - alias: app
          imageName: ghcr.io/guilhermelinosp/fast-listeners
