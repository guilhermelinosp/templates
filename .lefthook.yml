output: false

pre-commit:
  parallel: false
  commands:
    fmt:
      glob: "*.go"
      run: if [ -f go.mod ]; then go fmt ./...; fi
    vet:
      glob: "*.go"
      run: if [ -f go.mod ]; then go vet ./...; fi
    tidy:
      run: if [ -f go.mod ]; then go mod tidy && git diff --exit-code -- go.mod go.sum; fi
    lint:
      run: |
        if [ -f go.mod ] && command -v golangci-lint >/dev/null 2>&1; then
          golangci-lint run
        else
          echo "golangci-lint not installed; skipping"
        fi
    secrets-scan:
      glob: "*.{yaml,yml,go,json,sh}"
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks detect --source . --no-git -v
        else
          echo "gitleaks not installed; skipping"
        fi

pre-push:
  commands:
    tidy:
      run: if [ -f go.mod ]; then go mod tidy && git diff --exit-code -- go.mod go.sum; fi
    test:
      run: if [ -f go.mod ]; then go test -count=1 -race ./...; fi

commit-msg:
  commands:
    conventional:
      run: 'grep -Eq "^(feat|fix|docs|style|refactor|perf|test|ci|chore|revert|ops)(\\(.+\\))?!?: .+" {1}'
